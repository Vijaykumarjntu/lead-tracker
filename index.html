<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emerging GitHub Repos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 20px;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #aaa;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .tab {
            padding: 12px 30px;
            background: #1e1e2e;
            border: 1px solid #333;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .tab:hover {
            background: #2a2a3a;
        }

        .tab.active {
            background: #4CAF50;
            border-color: #4CAF50;
            color: white;
        }

        .section-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #333;
        }

        .section-title span {
            color: #4CAF50;
        }

        .repos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .repo-card {
            background: #1e1e2e;
            border-radius: 12px;
            padding: 18px;
            transition: transform 0.2s;
            cursor: pointer;
            border: 1px solid #2a2a3a;
        }

        .repo-card:hover {
            transform: translateY(-3px);
            border-color: #4CAF50;
        }

        .repo-name {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
            word-break: break-all;
        }

        .repo-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
            font-size: 0.8rem;
            flex-wrap: wrap;
        }

        .language {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .lang-Python { background: #3776AB; }
        .lang-JavaScript { background: #F7DF1E; color: #333; }
        .lang-TypeScript { background: #3178C6; }
        .lang-Go { background: #00ADD8; }
        .lang-Rust { background: #DEA584; }
        .lang-Unknown { background: #555; }

        .stars { color: #FFD700; }
        .growth { color: #4CAF50; }

        .repo-desc {
            color: #aaa;
            font-size: 0.8rem;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .influencer {
            font-size: 0.7rem;
            color: #888;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #2a2a3a;
        }

        .loading, .error {
            text-align: center;
            padding: 50px;
        }

        .error {
            color: #ff6b6b;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #666;
            font-size: 0.8rem;
        }

        @media (max-width: 768px) {
            .repos-grid {
                grid-template-columns: 1fr;
            }
            .tab {
                padding: 8px 20px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Emerging GitHub Repos</h1>
            <p>Fast-growing open-source projects tracked by influencers</p>
        </div>

        <div class="tabs">
            <div class="tab active" data-url="/repos/under-2500">🌱 Under 2.5k stars</div>
            <div class="tab" data-url="/repos/under-10000">📈 Under 10k stars</div>
            <div class="tab" data-url="/repos/under-25000">🚀 Under 25k stars</div>
        </div>

        <div id="reposContainer">
            <div class="loading">Loading repos under 2.5k stars...</div>
        </div>

        <div class="footer">
            🔍 Updated daily | Tracked via GitHub influencers
        </div>
    </div>

    <script>
        const API_URL = 'https://emerging-repos-api.onrender.com';

        async function fetchRepos(url) {
            document.getElementById('reposContainer').innerHTML = '<div class="loading">Loading...</div>';
            
            try {
                const response = await fetch(`${API_URL}${url}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                displayRepos(data);
                
            } catch (error) {
                document.getElementById('reposContainer').innerHTML = `
                    <div class="error">
                        ❌ Error: ${error.message}<br>
                        <small>Make sure API is running at ${API_URL}</small>
                    </div>
                `;
            }
        }

        function displayRepos(data) {
            const repos = data.repos || [];
            const category = data.category || 'Repos';
            
            if (repos.length === 0) {
                document.getElementById('reposContainer').innerHTML = `
                    <div class="section-title">${category} <span>(0 repos)</span></div>
                    <div class="loading">No repos found</div>
                `;
                return;
            }

            const html = `
                <div class="section-title">${category} <span>(${repos.length} repos)</span></div>
                <div class="repos-grid">
                    ${repos.map(repo => renderCard(repo)).join('')}
                </div>
            `;
            
            document.getElementById('reposContainer').innerHTML = html;
        }

        function renderCard(repo) {
            const repoName = repo.repo || `${repo.owner}/${repo.name}`;
            const language = repo.language || 'Unknown';
            const stars = repo.stars || 0;
            const growth = repo.growth_score || repo.stars_per_month || 0;
            const desc = repo.description || 'No description';
            const influencer = repo.influencer || 'influencer';
            const influencerFollowers = repo.influencer_followers || 0;

            return `
                <div class="repo-card" onclick="window.open('https://github.com/${repoName}', '_blank')">
                    <div class="repo-name">${repoName}</div>
                    <div class="repo-meta">
                        <span class="language lang-${language}">${language}</span>
                        <span class="stars">⭐ ${stars.toLocaleString()}</span>
                        <span class="growth">📈 ${growth.toFixed(0)}/mo</span>
                    </div>
                    <div class="repo-desc">${desc.length > 100 ? desc.substring(0, 100) + '...' : desc}</div>
                    <div class="influencer">
                        🎭 Starred by @${influencer} (${influencerFollowers.toLocaleString()} followers)
                    </div>
                </div>
            `;
        }

        // Tab click handlers
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                // Update active tab styling
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                // Get the URL for this tab
                const url = tab.getAttribute('data-url');
                
                // Fetch repos for this tab
                fetchRepos(url);
            });
        });

        // Load default tab (under-2500)
        fetchRepos('/repos/under-2500');
    </script>
</body>
</html>
